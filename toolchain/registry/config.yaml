# Verdaccio 配置（私服交付通道）。见本目录 README.md"设计判断记录"一节的完整说明。
#
# 判断记录（2026-09-07）：
# - 不代理任何上游注册表（无 uplinks 段）：本私服只服务框架自己的三个包
#   （com.gamefoundation.adapter.unity / framework-data / toolchain），不承担"缓存 npm 公网包"
#   这一职责——Unity 侧的官方包（com.unity.*）走 Unity 自己的默认注册表，不经过本作用域注册表
#   （Unity Package Manager 只把 scopedRegistries.scopes 命中的包名前缀路由到自定义注册表，其余
#   包名仍走默认注册表，见 Unity 官方 scoped registry 机制）；本目录 package.json 的 verdaccio
#   本身用普通 `npm ci`（走 npm 默认公网注册表）安装，与 Verdaccio 服务启动后代理什么完全是两件
#   事，不需要为了"装 Verdaccio 自己"而在 Verdaccio 配置里声明 npmjs 上游。
# - 包名规则用 "com.gamefoundation.*"（点号前缀），不是 npm 的 "@scope/*" 语法——Unity UPM 包名
#   本身就是形如 "com.gamefoundation.adapter.unity" 的点分字符串，不带 "@"，因此不是 npm 意义上的
#   "作用域包"；Unity 侧 `scopedRegistries.scopes: ["com.gamefoundation"]` 里的"scope"是 Unity
#   自己的术语（包名前缀路由规则），与 npm registry 配置里 "@scope/*" 的 glob 写法是两个不同的
#   概念，不能直接套用任务描述里 "com.gamefoundation/*" 这一写法（那是斜杠，会匹配不到任何真实
#   包名）。保留 "@*/*" 分组是防御性写法（万一将来某个包改用 npm 作用域命名），当前三个包用不到。
# - 匿名可读、发布需登录（access: $all / publish: $authenticated），对应 Unity 侧消费方不需要
#   任何账号即可 `npm install`/UPM 拉包，只有 build.ps1 -PublishRegistry 走过 init_publisher.ps1
#   配置的发布账号令牌才能推包。
# - max_body_size 放宽到 200mb：默认 10mb 装不下 framework-data 包（data/_framework +
#   assets/_placeholder + assets/textmesh_pro_essentials 未压缩约 22MB，见 build.ps1 -Dist 判断
#   记录），实测 npm publish 一份该包因请求体超限被拒后补的配置。

storage: ./storage

# 判断记录（P06 根治，2026-09-07，审计 architecture/落地计划/audit-7e63d66-20260907/
# project-review.md P06；推翻并替换此前"max_users 不要写 -1"的判断记录，原记录的结论本身没错但
# 据此选择"干脆不设置该字段"是错的，见下）：
#
# 1. `max_users` 语义实测澄清（`node_modules/verdaccio-htpasswd/build/htpasswd.js` +
#    `node_modules/verdaccio-htpasswd/build/utils.js`，Verdaccio 6.10.3 / verdaccio-htpasswd
#    13.1.3）分两处、两条不同规则，此前的判断记录只验证了第一处，与任务描述"当作真值"的说法
#    刚好对应，但下结论"因此不能用 -1"是过早的：
#      a) 构造函数：`this.maxUsers = config.max_users ? config.max_users : Infinity` ——
#         这是 JS 的"假值兜底"写法，`0` 在 JS 里是假值，`config.max_users` 传 `0` 时这一行反而
#         落到 `Infinity` 分支（不限用户数！）——任务描述建议的 `max_users: 0` 实测*不会*禁用
#         自注册，是这个插件自身的假值陷阱，不能按字面意思理解成"允许 0 个用户"。真正传入
#         `sanityCheck` 的 `maxUsers` 只有在配置值本身是"真值"时才会生效。
#      b) `sanityCheck`（utils.js）：`if (maxUsers < 0) { ...registration is disabled... }`
#         ——负数是插件专门用来表示"完全禁用自注册"的显式约定（不是"当作真值传下去导致任何用户数
#         都超限"这种副作用），`-1` 在 JS 里是真值，能正常传下去，命中的正是这条专门的禁用分支，
#         不依赖"用户数 >= -1 恒真"这种旁路解读。综合 a) + b)：唯一能真正禁用自注册的写法是显式
#         负数，`-1` 是最直接的选择；不设置该字段（或设 0）都会落到 Infinity（不限用户数），
#         这正是 P06 复现的漏洞本身——此前判断记录选择"不设置"来规避初始化失败，等于放弃了
#         "禁用自注册"这个目标，两害相权选了错的一害。
#
# 2. `-1` 确实会连带挡住 `init_publisher.ps1` 原来的建号方式——`auth.add_user`（HTTP
#    `PUT /-/user/...` 在请求未预先以目标用户身份认证时走的建号路径）同样受 `sanityCheck` 的
#    `maxUsers < 0` 门槛限制，这是此前判断记录发现的真实现象。根治不是放弃禁用自注册，而是让
#    `init_publisher.ps1` 换一条不经过这个门槛的建号路径：直接把发布账号的 bcrypt 哈希写入
#    `auth.htpasswd.file` 指向的 htpasswd 文件（见该脚本"直接写 htpasswd 文件"判断记录），
#    再发 `PUT /-/user/...` 时请求已经带着能通过该文件验证的 Basic 认证头——Verdaccio 的
#    `user.js` 路由处理器按"请求是否已经以目标用户身份认证"分流（`remoteName === name`），
#    已认证走"重新登录换新令牌"分支（`auth.authenticate`），完全不经过 `auth.add_user`/
#    `sanityCheck`/`maxUsers` 这条门槛——这是 Verdaccio 自己的既有分支，不是新开的后门。
#
# 3. publish/unpublish 从 `$authenticated`（任何登录成功的账号，即"自注册后即可发布"这一 P06
#    漏洞本身）改为显式指定发布账号用户名 `ws-game-publisher`（与 `init_publisher.ps1`
#    `-Username` 默认值一致）——htpasswd 认证插件不提供真正的"用户组"概念（`authenticate` 返回
#    的 groups 只有 `[user]` 自身，见该插件源码），Verdaccio 的包访问规则本身支持直接写字面用户名
#    （不止 `$all`/`$anonymous`/`$authenticated` 这几个内置特殊组），因此"仅 publisher 用户"用
#    字面用户名表达，不依赖分组能力。若改用别的发布账号用户名，需要同步修改这里与
#    `init_publisher.ps1 -Username` 默认值（或调用时显式保持一致）。access（读）不变，仍是
#    `$all`（匿名可读，UPM/npm install 消费方不需要账号）。
auth:
  htpasswd:
    file: ./htpasswd
    max_users: -1

max_body_size: 200mb

packages:
  'com.gamefoundation.*':
    access: $all
    publish: ws-game-publisher
    unpublish: ws-game-publisher

  '@*/*':
    access: $all
    publish: ws-game-publisher
    unpublish: ws-game-publisher

  '**':
    access: $all
    publish: ws-game-publisher
    unpublish: ws-game-publisher

# 只服务局域网/本机场景：默认监听地址由 start_registry.ps1 的 -Listen 参数传入
# （默认 127.0.0.1:4873），不在本文件里写死，便于同一份配置在"仅本机"与"局域网内其它机器可访问"
# 两种场景间切换（后者传 -Listen 0.0.0.0:4873）。

middlewares:
  audit:
    enabled: true

log: { type: stdout, format: pretty, level: warn }
