name: CI

# 判断记录（T-N6-7，数值仿真基线比对自动纳入，不新增任何步骤/下载）：check.ps1 新增的"数值仿真
# 基线比对"步骤（toolchain/simrunner，直接执行步骤 1 已构建的 SimRunner.dll 对嵌入式最小仿真
# 数据集与既有基线比对）不需要 Unity、不需要额外下载任何外部产物——本工作流固定调用
# `check.ps1 -SkipUnity`（见下一条判断记录），该步骤因此随 check.ps1 本身的变化自动被纳入本
# CI job，本文件不需要新增任何显式调用；-Quick 才会跳过它（本工作流从未传 -Quick）。
#
# 判断记录（为什么只跑非 Unity 门禁）：check.ps1 全量还含 Unity 编译检查/EditMode/PlayMode/
# 独立版构建与两种无人值守冒烟/消费方演练共六步，这些步骤要求本机已安装并激活 Unity 授权
# （见仓库根 check.ps1 -UnityExe 参数说明、README「Unity 工作台」一节）。GitHub 托管的
# windows-latest 运行器既没有装 Unity，也没有可用的 Unity 授权（个人版授权与具体机器绑定，
# 不能在无人值守的托管运行器上激活），因此 CI 固定传 -SkipUnity，只跑 .NET 构建测试、两道
# 数据校验、生成器一致性检查、toolchain 自身测试、两道禁用词扫描、版本一致性、
# build.ps1 -SkipTests 同步 DLL、包清单一致性这些不依赖 Unity 编辑器的步骤；Unity 四步与
# 消费方演练仍然是本机 check.ps1 全量跑（含 -Il2cpp 可选步骤）的职责，不进 CI。
#
# 判断记录（windows-latest 上 PowerShell 5.1 与 7 的兼容性）：check.ps1/build.ps1 头注释都
# 明确写了"PowerShell 5.1 兼容：不使用 &&、??、三元运算符"，这两个脚本本身没有用到任何仅
# PowerShell 7 才有的语法。windows-latest 镜像上 `powershell.exe`（Windows PowerShell 5.1，
# 系统自带）与 `pwsh`（PowerShell 7，镜像预装）两者都在，本工作流固定用 `powershell.exe`
# 调用（与本机开发者的调用方式、.githooks/pre-commit 的调用方式保持一致，不依赖镜像上是否
# 预装 pwsh）；本地模拟验证阶段额外用 `pwsh` 跑过一次同样通过，两者都可用，选 `powershell.exe`
# 只是为了和其余所有调用点统一。
#
# 判断记录（持续集成修复：控制台 UTF-8 + PowerShell 5.1 原生 stderr 包装两处根因）：
# PR #1 首跑在 `python toolchain/gen_event_constants.py --check` 这一步失败。根因一
# （真正让 Python 崩溃的原因）：`windows-latest` 运行器的控制台代码页不是 UTF-8（非交互式
# 管道场景下 Python 拿不到真实控制台代码页，退化为系统 ANSI 代码页，英文版镜像上是
# cp1252），该脚本打印中文提示（如"check 通过…"）时未做任何编码处理，直接
# UnicodeEncodeError 崩溃退出——`toolchain/validate_data.py` 与 `toolchain/asset_import`
# 包因为已经在入口 reconfigure 成 UTF-8（见 `toolchain/_console.py`）所以没有中招。已在
# `toolchain/_console.py` 新增共用的 `ensure_utf8_stdio()`，全部命令行入口脚本
# （`gen_event_constants.py`/`gen_placeholder_assets.py`/`validate_data.py`/
# `asset_import` 包）统一在最开始调用；本工作流仍额外设置 `PYTHONUTF8`/`PYTHONIOENCODING`
# 两个环境变量做双保险（即便未来哪个新脚本忘了调用 `ensure_utf8_stdio()`，也不至于在这个
# 运行器上直接崩溃）。根因二（真正让人看不到 traceback 的原因）：`check.ps1` 脚本作用域把
# `$ErrorActionPreference` 设成了 `"Stop"`，PowerShell 5.1 对"原生命令写到 stderr 的任意
# 一行"在该偏好下会提升成终止性的 `NativeCommandError` 异常、只保留第一行文本——Python 未
# 捕获异常的 traceback 正文因此被吞掉，`check.ps1` 汇总表 Detail 列里只剩一句
# "Traceback (most recent call last):"，看不出真正报错原因；已在 `check.ps1` 的
# `Test-NativeExitCode` 函数内部把 `$ErrorActionPreference` 局部降级为 `"Continue"`
# 根治（函数作用域，不影响脚本其余部分）。此外，GitHub Actions 的 `shell: powershell`
# 步骤本身也默认注入 `$ErrorActionPreference = "Stop"`（连同调用 `check.ps1` 那一层原本还
# 用 `2>&1 | Tee-Object` 把子进程 stderr 并入管道，双重叠加同一类风险），因此下面调用
# `check.ps1` 的步骤脚本第一行显式设为 `Continue`，并去掉外层的 `2>&1 | Tee-Object`
# 包装，改让 `check.ps1` 自己通过新增的 `-LogFile` 参数（内部用 `Start-Transcript`）把完整
# 输出落盘，退出码仍然是 `check.ps1` 最后 `exit 0`/`exit 1` 的真实值，经 `$LASTEXITCODE`
# 原样透传。
#
# 判断记录（2026-09-07，CI 运行 f0389f8 失败：唯一失败步骤"包清单一致性"，Detail
# "build.ps1 -SyncOnly -Dist auto 失败，退出码 1"，仅用时 0.6s）：根因是 check.ps1 当时的步骤
# 顺序把"包清单一致性"（跑 `build.ps1 -SyncOnly -Dist auto`）排在"build.ps1 -SkipTests
# 同步 DLL"之前，而 `-SyncOnly` 要求六个核心 DLL 已经存在于各工程 `bin\Release\netstandard2.1\`
# 下（见 build.ps1"1. dotnet build"/"3. 同步六个核心 DLL"两节）；本仓库前面的 `dotnet build`
# 步骤用了 `--artifacts-path`，产物不落在 `bin\` 下，真正会把 DLL 构建到 `bin\` 的
# `build.ps1 -SkipTests` 排在这一步之后，导致该步骤在全新 checkout（`bin\` 不存在）的
# `windows-latest` 运行器上必然失败；本机之前之所以能通过，只是因为仓库历史上跑过其它
# `build.ps1` 留下的陈旧 `bin\` 目录侥幸存在。根治：把该步骤挪到"build.ps1 -SkipTests"之后
# （详见 check.ps1"9.5 包清单一致性"步骤上方判断记录），并把该步骤里 `build.ps1` 的输出从
# `| Out-Null` 改为逐行 Write-Host + 收集，失败时把最后 30 行并入 throw 的消息，避免类似问题
# 再次出现时 CI 日志又只剩一句"退出码 1"看不出具体原因。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    env:
      # 双保险：见上方判断记录"控制台 UTF-8 + PowerShell 5.1 原生 stderr 包装两处根因"。
      # 作用于本 job 全部步骤（含下面的 pip install 与 check.ps1，以及 check.ps1 内部再拉起
      # 的 dotnet/python 子进程——环境变量沿子进程继承链原样传递）。这一组变量是
      # PYTHONUTF8（先于本次合入已在 ae3f667 加入的作业级兜底）与 PYTHONIOENCODING 的超集，
      # 两者合并保留，不丢失任何一侧的覆盖面。
      #
      # 判断记录（第九轮审计工具链条目，2026-09-08，见
      # audit-85f1f4f-20260908/）：本机复现过 toolchain/tests 里
      # subprocess.run(...).stdout/.stderr 解码用的 locale.getpreferredencoding() 是 cp936
      # （非 UTF-8 控制台代码页），CI 这台 windows-latest 运行器是否会踩同一类问题取决于其系统
      # 区域设置的默认非 Unicode 程序代码页，未逐一核实——本 job 已经作业级设了 PYTHONUTF8/
      # PYTHONIOENCODING，理论上不受影响；本地开发机与本仓库 check.ps1 非 -Quick 分支下的
      # pytest 步骤、.githooks/pre-commit 均已同步导出 PYTHONUTF8=1（见 check.ps1 该步骤与
      # .githooks/pre-commit 判断记录），本地与 CI 的编码环境要求保持一致，不应出现"CI 通过、
      # 本机默认编码下失败"的分叉。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      # 判断记录（完整历史与标签，2026-10-02，CI 运行 36964876322 / 36915403742 等 pytest 阶段 6 失败 + 5 跳过
      # 的根因之一）：actions/checkout 默认只拉一个提交、不带标签（fetch-depth: 1），而 toolchain/tests 里有
      # 两类用例按本机完整仓库的口径写：(1) test_ref_conventions.py 的三条"与重构前格式对齐"用例用
      # `git show <历史提交>:<路径>` 读重构前的 map_cmd.py/common.py，浅克隆里没有该对象，报 "invalid object
      # name"；(2) test_dist_immutability_guard.py 的两条 build.ps1 入口接线用例取"仓库里真实的 vX.Y.Z 标签"
      # 作为已发布版本，浅克隆没有任何标签就 pytest.skip，而门禁 pytest 的 max_skipped=0（gate_floors.json，
      # 环境性 skip 判 FAIL）。本机恒有完整历史与标签，CI 补齐同一环境，不改用例、不放宽下限。仓库 pack 约
      # 45 MB，全量拉取是秒级。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: toolchain/requirements.txt

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Python dependencies
        # 判断记录：只装 requirements.txt（必需依赖，当前是 Pillow —— 占位资产生成器
        # 一致性检查 gen_placeholder_assets.py --check 要用到）；requirements-optional.txt
        # 的 rembg 是资产导入工具的可选抠图后端，体积大且需要本机预先准备好 ~/.u2net/*.onnx
        # 权重才真正可用，check.ps1 门禁的任何一步都不依赖它，CI 不装，见该文件头注释。
        run: pip install -r toolchain/requirements.txt

      # 判断记录（PJ114-02 根治，外部审计 audit-76d16a5-20260910）：check.ps1 的 ABI 探针步骤
      # （toolchain/abi_probe.ps1）需要一份基线版本（toolchain/abi_probe_baseline.txt 记录）的
      # 正式发行包 zip 才能真正跑起来；`dist/` 是仓库根 .gitignore 排除的本机构建缓存，全新
      # checkout 的 CI 运行器天然没有历史版本产物。这里在跑 check.ps1 之前，从本仓库的 GitHub
      # Release 下载那个基线版本对应的 `ws-game-<version>.zip` 落到 dist/ 下，让 CI 上的 ABI 探针
      # 也能真正执行，而不是每次都退化成 SKIP。按版本号做 actions/cache 缓存，同一个基线版本号
      # 在后续运行里不需要重复下载。下载失败（网络问题、当时还没有任何 Release 等）不应该让本步骤
      # 或整个 job 直接崩溃——按"CI 非严格"处理：不传 check.ps1 的 -AbiStrict，基线缺失时 ABI 步骤
      # 自然显示为可见 SKIP（见 check.ps1 -AbiStrict 说明），但下载失败必须在步骤输出里留一条
      # 显式 warning，不能悄悄略过。
      #
      # 判断记录（run: 正文只用纯 ASCII）：见 release.yml 文件头"run: 脚本正文必须是纯 ASCII"的
      # 教训——托管运行器上 Windows PowerShell 5.1 按系统 ANSI 代码页读取不带 BOM 的 run: 临时
      # 脚本文件，中文字节序列可能被误解析成词法定界符导致语法错误；本步骤提示文案全部用英文，
      # 中文说明写在 run: 代码块之外的 YAML 注释里。
      - name: Read ABI baseline version
        id: abi_baseline
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $version = (Get-Content -LiteralPath "toolchain/abi_probe_baseline.txt" -Raw).Trim()
          Write-Host "ABI baseline version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache ABI baseline release package
        id: abi_baseline_cache
        uses: actions/cache@v4
        with:
          path: dist/ws-game-${{ steps.abi_baseline.outputs.version }}.zip
          key: abi-baseline-${{ steps.abi_baseline.outputs.version }}

      - name: Download ABI baseline release package
        if: steps.abi_baseline_cache.outputs.cache-hit != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $version = "${{ steps.abi_baseline.outputs.version }}"
          $zipName = "ws-game-$version.zip"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          gh release download "v$version" -p $zipName -D dist
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Failed to download ABI baseline release package v$version ($zipName). The ABI surface diff step will show SKIP for this run, not a real pass. See toolchain/abi_probe.ps1 -SkipIfBaselineMissing."
          } else {
            Write-Host "Downloaded $zipName into dist/"
          }
          exit 0

      # 判断记录（真实发布包回归用例的输入，2026-10-02，CI pytest 5 个跳过里的 3 个）：
      # test_lock_writeback_repair_parity.py 与 test_get_framework_path_boundary.py 里的"真实产物回归"用例
      # 取 dist/ 里版本最大、zip 与 lock 成对齐全的发布包（toolchain/tests/_latest_dist.py）；全新 checkout
      # 的 dist/ 没有任何成对的包（上面只下载了 ABI 基线的 zip，没有 lock，且基线 1.12.0 是早期布局，
      # 不是这批用例要验证的"当前布局"），用例 skip，而 pytest 的 max_skipped=0 把环境性 skip 判 FAIL。
      # 与上面 ABI 基线同一做法：从本仓库 GitHub Release 取最新一个 zip+lock 齐全的发布包落到 dist/，
      # 按版本号做 actions/cache 缓存。下载失败只留 warning、不让本步骤崩溃——此时那几条用例会 skip，
      # 由 pytest 步骤的 skip 上限如实判 FAIL，不悄悄放过。run: 正文只用纯 ASCII（理由见上）。
      - name: Resolve latest published release package
        id: latest_pkg
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $picked = ""
          $tags = @(gh release list --limit 10 --json tagName --jq ".[].tagName")
          foreach ($t in $tags) {
            $v = ([string]$t).Trim().TrimStart("v")
            if ($v -notmatch '^\d+\.\d+\.\d+$') { continue }
            $names = @(gh release view $t --json assets --jq ".assets[].name")
            if (($names -contains "ws-game-$v.zip") -and ($names -contains "ws-game-$v.lock")) { $picked = $v; break }
          }
          if ($picked -eq "") {
            Write-Host "::warning::No GitHub Release with both ws-game-<ver>.zip and ws-game-<ver>.lock found; real-artifact pytest cases will skip and the pytest skip cap will fail the run."
          } else {
            Write-Host "Latest published package: $picked"
          }
          "version=$picked" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache latest published release package
        id: latest_pkg_cache
        if: steps.latest_pkg.outputs.version != ''
        uses: actions/cache@v4
        with:
          path: |
            dist/ws-game-${{ steps.latest_pkg.outputs.version }}.zip
            dist/ws-game-${{ steps.latest_pkg.outputs.version }}.lock
          key: release-pkg-${{ steps.latest_pkg.outputs.version }}

      - name: Download latest published release package
        if: steps.latest_pkg.outputs.version != '' && steps.latest_pkg_cache.outputs.cache-hit != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $version = "${{ steps.latest_pkg.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          gh release download "v$version" -p "ws-game-$version.zip" -p "ws-game-$version.lock" -D dist --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Failed to download release package v$version into dist/. Real-artifact pytest cases will skip and the pytest skip cap will fail the run."
          } else {
            Write-Host "Downloaded ws-game-$version.zip and .lock into dist/"
          }
          exit 0

      - name: Run check.ps1 -SkipUnity
        shell: powershell
        # 判断记录：见文件头"控制台 UTF-8 + PowerShell 5.1 原生 stderr 包装两处根因"。
        # 第一行显式把本步骤自身的 $ErrorActionPreference 降级为 Continue（覆盖 GitHub
        # Actions 对 `shell: powershell` 步骤默认注入的 Stop），避免子进程（check.ps1）写到
        # stderr 的内容在这一层再被提升成终止性异常；不再对 `powershell -File check.ps1 ...`
        # 外层包 `2>&1 | Tee-Object`——完整控制台输出（含每步 PASS/FAIL 明细与最后的汇总表）
        # 改由 check.ps1 自己通过新增的 -LogFile 参数（内部 Start-Transcript）落盘到
        # $logPath，供下一步以 artifact 形式上传；exit 码就是 `powershell -File` 这次调用的
        # $LASTEXITCODE，未经任何管道包装，原样透传。
        run: |
          $ErrorActionPreference = "Continue"
          $artifactsPath = Join-Path $env:RUNNER_TEMP "gf_check_artifacts"
          $logPath = Join-Path $env:RUNNER_TEMP "check_output.log"
          powershell -NoProfile -ExecutionPolicy Bypass -File check.ps1 -SkipUnity -ArtifactsPath $artifactsPath -LogFile $logPath
          exit $LASTEXITCODE

      - name: Upload check.ps1 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: |
            ${{ runner.temp }}/check_output.log
            ${{ runner.temp }}/gf_check_artifacts/**/*.log
            ${{ runner.temp }}/gf_check_artifacts/**/*.binlog
          if-no-files-found: ignore
