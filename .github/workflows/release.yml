name: Release

# 判断记录（为什么只跑快速门禁，而不是完整门禁）：完整门禁（含 Unity 编译检查/EditMode/PlayMode/
# 独立版构建与两种无人值守冒烟/消费方演练）在打 tag 之前、本机执行 `build.ps1 -Release` 时已经
# 跑过一遍（`-Release` 第 5 步默认要求 check.ps1 全量通过才允许继续，见 build.ps1 .PARAMETER
# Release 说明）；GitHub 托管的 windows-latest 运行器既没有装 Unity，也无法激活个人版 Unity
# 授权（同 ci.yml 的既有判断记录），因此本工作流只对刚推送的 tag 重新跑一遍快速门禁
# （`check.ps1 -SkipUnity -Quick`）作为"这个 tag 指向的提交没有被后续意外改动"的一层兜底交叉
# 验证，不代表这是本次发布唯一的质量门槛。
#
# 判断记录（为什么打包用 `build.ps1 -SyncOnly -Dist <ver> -Zip` 而不是 `-Release`）：`-Release`
# 会做版本号写回校验、`git commit`、`git tag` 等只应该在本机执行一次的操作；tag 已经在本机打好并
# 推送到这里触发本工作流，此时仓库内的 VERSION/package.json 已经是发布版本号本身（tag 指向的提交
# 就是 `-Release` 提交的那一个），本工作流只需要"基于当前已构建产物重新打一份 zip + lock 上传为
# Release 附件"，对应 build.ps1 新增的独立开关 `-Zip`（不做版本号校验/提交/打标签，见其
# .PARAMETER Zip 说明）；`-SyncOnly` 跳过 dotnet build/test（前面 check.ps1 -Quick 已经跑过一遍
# dotnet build/test），只做 DLL 同步 + 内容同步 + 打包，加快本工作流耗时。
#
# 判断记录（Release 附件的产生与上传时机，2026-09-07 改写）：原判断记录认为"托管运行器重新打包
# 上传同名附件会直接覆盖，两条路径幂等收敛到同一份内容"——这个结论不成立，已废弃。真正原因：
# build.ps1 打包时把六个核心 DLL 的 sha256 写进 `dist/ws-game-<ver>.lock`，而 DLL 是确定性构建
# （见 Core.sln 各工程 Deterministic/ContinuousIntegrationBuild 设置），确定性构建仍然会把源码的
# 绝对路径编码进调试信息，托管运行器的 checkout 路径（如 `D:\a\ws-game\ws-game`）与本机开发路径
# 不同，导致同样的源码在两处构建出的 DLL 字节不同、sha256 不同。本机 `build.ps1 -Release` 产出的
# zip/lock 已经在含 Unity 的完整门禁（EditMode/PlayMode/独立版构建/两种冒烟/消费方演练全过）下
# 验证过，且若传了 `-Publish -PublishRegistry` 还已经发布到私服、被下游游戏仓库的 `ws-game.lock`
# 锁定为依赖——此时若本工作流用托管运行器重新构建的 DLL 覆盖同名 Release 附件，会让 GitHub
# Release 上的 `.lock` 与私服包的哈希不一致，下游用 zip 快照通道拉取时的哈希校验会与私服通道的
# 结果对不上，制造混淆。因此改为"本机已验证的产物优先"：打包前先用 `gh release view` 检查该 tag
# 对应的 Release 是否已经有 `ws-game-<ver>.zip`（即本机 `-Publish` 已经上传过）；已有则跳过本工作流
# 的打包与上传，只打印说明，不覆盖；没有（说明本机只打了 tag、没传 `-Publish`，例如设计层要求
# 先只推 tag、人工确认后再决定是否发布 Release）才走原有的 `-SyncOnly -Dist -Zip` + 上传路径，
# 作为"tag 一推送就自动出 Release"的兜底。
#
# 判断记录（run: 脚本正文必须是纯 ASCII，2026-09-07 新增）：推送标签 v1.0.0 触发的运行
# （run 34094116412）在 "Resolve version from tag" 步骤失败，报
# "The string is missing the terminator: ''" / "Missing closing '}'"。根因：GitHub Actions
# 把 `shell: powershell` 步骤的 `run:` 正文写成不带 BOM 的 UTF-8 临时 .ps1 文件；托管运行器上的
# Windows PowerShell 5.1 按系统 ANSI 代码页（英文镜像是 cp1252）读取该文件，中文提示文本的 UTF-8
# 字节序列里恰好出现 0x93/0x94 等字节，被 cp1252 解释成弯引号“ ”，而 PowerShell 词法分析器把
# 弯引号也当成字符串定界符，于是脚本正文里的字符串边界被打乱、报语法错误。`ci.yml` 的
# `shell: powershell` 步骤没有中招，是因为它的 `run:` 正文本来就只有 ASCII 字符（中文说明全写在
# `run:` 代码块之外的 YAML `#` 注释里，注释不受这个问题影响）。规则：本文件（以及任何
# `shell: powershell` 步骤）的 `run:` 正文只允许 ASCII 字符；提示文案一律用英文，中文说明写在
# `run:` 之外的 `#` 注释里。已用
# `[System.Management.Automation.Language.Parser]::ParseInput` 对每个 run: 正文做过本地语法解析
# 验证（抽出正文存为无 BOM UTF-8 文件，`powershell -File` 试执行/解析），确认无错。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # 判断记录：手动重跑入口，用于对已经推送过的 tag 重新验证本工作流（例如本工作流自身改动后
    # 想在不重新打 tag 的前提下确认修复有效），不产生新 tag，也不改变"本机已验证产物优先"的
    # 附件策略——手动跑一样会先查 Release 是否已有对应 zip，已有照样跳过打包上传。
    inputs:
      tag:
        description: "Tag to verify, formatted as vX.Y.Z (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # 双保险：见 ci.yml 判断记录"控制台 UTF-8 + PowerShell 5.1 原生 stderr 包装两处根因"。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 判断记录：push 触发时 github.event.inputs.tag 为空，取 github.ref_name（即被推送的
          # tag 本身）；workflow_dispatch 触发时 github.ref_name 是运行工作流所在的分支（如
          # main），必须显式取输入的 tag，否则会 checkout 到分支 HEAD 而不是要验证的那个 tag。
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup .NET 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: toolchain/requirements.txt

      - name: Setup Node.js 20.x
        # 私服交付通道新增：build.ps1 -Dist（本工作流下面 -SyncOnly -Dist -Zip 步骤隐含调用）
        # 现在无论如何都会额外 npm pack 出三个私服包的 .tgz（见 build.ps1 "5.15" 判断记录），
        # 需要 node/npm；显式 setup-node 固定版本，不依赖托管运行器预装的版本浮动。
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Python dependencies
        run: pip install -r toolchain/requirements.txt

      - name: Resolve version from tag
        id: version
        shell: powershell
        # 判断记录：tag 名固定形如 "vX.Y.Z"，去掉前导 "v" 就是 build.ps1 -Dist/-Zip 需要的纯
        # 版本号；同时校验一遍格式，格式不对直接失败，不静默用一个错误版本号继续打包。
        # workflow_dispatch 手动触发时用输入的 tag，push 触发时用 github.ref_name；见文件头
        # "run: 脚本正文必须是纯 ASCII" 判断记录，本步骤提示文案改用英文。
        run: |
          $ErrorActionPreference = "Continue"
          $tagName = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrEmpty($tagName)) {
            $tagName = "${{ github.ref_name }}"
          }
          if (-not ($tagName -like "v*")) {
            Write-Host "Unexpected tag name: $tagName (expected vX.Y.Z)"
            exit 1
          }
          $version = $tagName.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "Version parsed from tag is invalid: '$version' (expected X.Y.Z)"
            exit 1
          }
          Write-Host "tag=$tagName -> version=$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run check.ps1 -SkipUnity -Quick
        shell: powershell
        # 判断记录：见 ci.yml 同名步骤的判断记录（$ErrorActionPreference 降级 + -LogFile 落盘，
        # 不再对外层包 2>&1 管道）。
        run: |
          $ErrorActionPreference = "Continue"
          $artifactsPath = Join-Path $env:RUNNER_TEMP "gf_release_check_artifacts"
          $logPath = Join-Path $env:RUNNER_TEMP "release_check_output.log"
          powershell -NoProfile -ExecutionPolicy Bypass -File check.ps1 -SkipUnity -Quick -ArtifactsPath $artifactsPath -LogFile $logPath
          exit $LASTEXITCODE

      - name: Upload check.ps1 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-logs
          path: |
            ${{ runner.temp }}/release_check_output.log
            ${{ runner.temp }}/gf_release_check_artifacts/**/*.log
            ${{ runner.temp }}/gf_release_check_artifacts/**/*.binlog
          if-no-files-found: ignore

      - name: Check for existing release assets
        id: assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        # 判断记录：见文件头"Release 附件的产生与上传时机"——本机已验证产物优先，托管运行器不
        # 覆盖本机 -Publish 已经上传过的 zip。用 gh release view --json assets 查该 tag 对应
        # Release 的既有附件列表，命中同名 zip 就跳过下面的打包与上传步骤；Release 不存在（gh
        # 返回非零）或存在但没有该 zip，都视为需要走原有兜底路径。
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $zipName = "ws-game-$version.zip"
          $json = gh release view $tag --json assets 2>$null
          $skip = "false"
          if ($LASTEXITCODE -eq 0 -and $json) {
            $assetNames = ($json | ConvertFrom-Json).assets | ForEach-Object { $_.name }
            if ($assetNames -contains $zipName) {
              Write-Host "Release $tag already has $zipName (uploaded by local build.ps1 -Release -Publish). Skipping rebuild-and-upload to avoid overwriting a verified artifact with a hosted-runner rebuild (see file header note on deterministic-build path hashes)."
              $skip = "true"
            } else {
              Write-Host "Release $tag exists but has no $zipName yet. Will build and upload as a fallback."
            }
          } else {
            Write-Host "Release $tag not found yet (gh release view exit code $LASTEXITCODE). Will build and upload as a fallback."
          }
          "skip=$skip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: build.ps1 -SkipTests (produce default-location DLLs for packaging)
        # 判断记录（P01 根治，2026-09-07）：check.ps1 -Quick 的 "dotnet build" 步骤固定带
        # `--artifacts-path`（见 check.ps1 .PARAMETER ArtifactsPath 说明及其对
        # `dotnet build/test` 的调用），这是 dotnet SDK 的统一产物布局（unified artifacts output），
        # 产物落在 `<artifacts-path>/bin/<project>/<pivot>/` 下，不是 build.ps1 打包步骤固定读取的
        # 传统逐工程目录 `core/*/bin/$Configuration/netstandard2.1/*.dll`（见 build.ps1 第 545 行
        # `$asm.Dir + "\bin\$Configuration\netstandard2.1\..."`）。check.ps1 全量模式第 9 步
        # （"build.ps1 -SkipTests（同步 DLL）"）本来就是靠再跑一次不带 --artifacts-path 的
        # `dotnet build` 来补齐这批传统路径产物，但该步骤在 `-Quick` 下被跳过（-Quick 的设计前提
        # 是"这一步只有 Unity 相关步骤需要"，当时没有考虑到 release.yml 的打包 fallback 同样依赖
        # 这批传统路径 DLL）。因此这里在 `-SyncOnly -Dist -Zip` 之前显式补跑一次
        # `build.ps1 -SkipTests`（不带 -SyncOnly，走完整 `dotnet build` 分支，跳过 `dotnet test`——
        # 测试已经被上面的 check.ps1 -Quick 覆盖过一遍，不重复跑），产出传统路径 DLL 并同步进
        # Unity 适配层包的 Runtime/Plugins/Core/，下面 `-SyncOnly` 步骤（第 3 步 DLL 同步）才能找到
        # 源文件。这条路径与 check.ps1 全量模式第 9 步是同一段逻辑、同一个根因修法，只是移到
        # release.yml 里显式补一次，而不是放宽 -Quick 本身的跳过范围（-Quick 仍然只覆盖
        # dotnet/python 校验、不隐含"顺带把 DLL 摆到打包需要的位置"这个语义，避免以后有人在别的
        # -Quick 调用点意外依赖这个副作用）。
        if: steps.assets.outputs.skip != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -SkipTests
          exit $LASTEXITCODE

      - name: build.ps1 -SyncOnly -Dist <version> -Zip
        if: steps.assets.outputs.skip != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -SyncOnly -Dist "${{ steps.version.outputs.version }}" -Zip
          exit $LASTEXITCODE

      - name: Upload Release assets
        if: steps.assets.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/ws-game-${{ steps.version.outputs.version }}.zip
            dist/ws-game-${{ steps.version.outputs.version }}.lock
            dist/${{ steps.version.outputs.version }}/packages/*.tgz
          # 判断记录（三个 .tgz 只作为 Release 附件、不在这里发到任何注册表）：私服（Verdaccio）
          # 只服务内网/本机场景，托管运行器既没有、也不应该配置一个可公网访问的私服地址；发布到
          # 注册表是本机 `build.ps1 -Release -Publish -PublishRegistry` 的职责（见该开关说明），
          # 本工作流只把本机同一套打包逻辑重新产出的三个 .tgz 一并作为 GitHub Release 附件上传，
          # 方便没有私服访问权限的场景也能拿到这三个包（手动 `npm install <tgz 路径>` 或
          # `npm publish <tgz 路径> --registry <自己的私服>`）。
          # 判断记录：不传 body/generate_release_notes——若 Release 已由本机 `-Release -Publish`
          # 创建（已带标题与 CHANGELOG.md 摘录的说明文本），这里只追加/覆盖附件，不覆盖已有说明；
          # 若 Release 尚不存在，本步骤会新建一个，说明文本留空由后续人工在 GitHub 网页补充，
          # 也可以直接照 CHANGELOG.md 对应版本条目复制——不在本工作流里重新生成一份，避免与本机
          # `-Release` 生成的 dist/release-notes-<ver>.txt 出现两份措辞不一致的发布说明。
          fail_on_unmatched_files: true
