name: Release

# 判断记录（为什么只跑快速门禁，而不是完整门禁）：完整门禁（含 Unity 编译检查/EditMode/PlayMode/
# 独立版构建与两种无人值守冒烟/消费方演练）在打 tag 之前、本机执行 `build.ps1 -Release` 时已经
# 跑过（`-Release` 第 5 步要求 check.ps1 通过才允许继续：全量，或复用已验证全量记录时的定向门禁，
# 见 build.ps1 .PARAMETER Release/FullRegate 说明与 ADR-0156）；GitHub 托管的 windows-latest 运行器既没有装 Unity，也无法激活个人版 Unity
# 授权（同 ci.yml 的既有判断记录），因此本工作流只对刚推送的 tag 重新跑一遍快速门禁
# （`check.ps1 -SkipUnity -Quick`）作为"这个 tag 指向的提交没有被后续意外改动"的一层兜底交叉
# 验证，不代表这是本次发布唯一的质量门槛。
#
# 判断记录（附件策略：本机已验证产物优先，工作流不构建 zip/lock/tgz，2026-10-02 合并改写，取代此前
# 分散的五段"打包/重建/混批"判断记录）：本机 `build.ps1 -Release` 产出的 zip/lock/tgz 已在含 Unity 的
# 完整门禁下验证过，且若传了 `-Publish -PublishRegistry` 还已发到私服、被下游游戏仓库的 `ws-game.lock`
# 锁定。DLL 是确定性构建（Core.sln 各工程 Deterministic/ContinuousIntegrationBuild），但确定性构建仍把
# 源码绝对路径编进调试信息，托管运行器的 checkout 路径（如 `D:\a\ws-game\ws-game`）与本机不同，同样的
# 源码在两处构建出的 DLL 字节、sha256 不同。因此本工作流从不在托管运行器上构建任何发布产物（没有
# `build.ps1` 打包步骤）：重建出来的会是同一版本号的第二套字节，与 Release 上已有附件或私服包混批、
# 对不上下游据以锁定的哈希，且无法证明同源。本工作流只做三件事——
#   1. 对刚推送的标签重跑快速门禁（`check.ps1 -SkipUnity -Quick`）交叉验证"标签指向的提交没被后续意外
#      改动"（`-Release` 第 5 步的完整门禁在本机已跑过）。
#   2. 用 `gh release view` 核对该标签对应 Release 的附件是否齐全（共九件：zip、lock、samples zip、四个
#      `com.gamefoundation.*-<ver>.tgz`、`get_framework.ps1`、`_hash.ps1`）。处置结论由纯函数
#      `Get-WsGameReleaseAssetsPlan`（`toolchain/_release_assets_plan.ps1`，
#      `toolchain/tests/test_release_assets_plan.py` 覆盖）给出：齐全 -> 跳过；zip 在、其余有缺 -> 从这份
#      已验证 zip 里抽取/重算补齐；zip 缺失 -> 明确失败并打印人工指引（见下一段）。
#   3. zip 在时，先下载它读 `MANIFEST.txt` 的 `git_commit`、lock 在时读其 JSON 的 `git_commit`，与当前
#      checkout（标签指向的提交）的完整 sha 做前缀比对，不一致直接 exit 1，不在一个"声称是这个标签、
#      实际是另一个提交"的产物上做任何事。缺失的附件只上传缺的那几个，已有附件不覆盖。
# "Repair missing assets from existing zip" 步骤不调用 `build.ps1`、不触发任何构建：lock 由
# `New-WsGameLockObjectFromZip` 从 zip 里的 DLL 重算哈希，四个 .tgz 从 zip 内 `packages/` 原样抽出，字节
# 与 zip 同源；samples zip 只含纯文本/资源源文件，可安全从 checkout 重新压缩，但若既有 lock 带
# `samples.sha256` 则重建物哈希必须与之一致，否则阻断。
#
# 判断记录（zip 缺失一律明确失败，不再全量重建，2026-10-02，v1.85.0～v1.91.0 的 Release 运行红灯）：
# 旧路径在"Release 上一个附件都没有"时调 `build.ps1 -SyncOnly -Dist <ver> -Zip` 全量重建，但 tag 触发的
# 运行检出的就是标签提交本身，`build.ps1` 的发布不可变守卫（`toolchain/_dist_immutability_guard.ps1`）
# 看到标签已存在而拒绝写产物，运行在最后一步红灯、日志只有一句"拒绝覆盖已发布版本"。修法二选一：(A) 改
# 守卫放行"从标签提交原样重建"；(B) 提前明确失败并给人工指引。选 B：不可变发布要求同一版本号只有一套
# 字节，而上一段已述托管运行器重建必然是另一套字节，放行重建只是换个名义制造第二套；A 还要放宽发布
# 不可变的唯一强制点，风险远大于收益。B 只动工作流，守卫不改。代价：只推标签而本机没上传 Release 附件
# 时不再自动出 Release，而是红灯并告知怎么做（本机 `build.ps1 -Release` 末尾打印的
# `gh release create` 命令是 Release 附件的唯一来源）。zip 缺失但 lock/tgz 仍在（混批）同样阻断，
# 指引文案不同（Reason 为 MixedBatch / NoVerifiedAssets）。
#
# 判断记录（提交号比对按完整 sha 前缀 + zip 条目不分路径分隔符，2026-10-02，v1.92.0 运行 36811895996 与
# v1.93.0 运行 36964875468 的两处不同根因）：上面 zip/lock 两处 `git_commit` 校验原先是
# `git rev-parse --short HEAD` 的字符串全等比较。`--short` 的位数取决于仓库对象数：发布机（完整仓库）
# 写进 MANIFEST/lock 的是 8 位（`b7ac4dc3`），托管运行器浅克隆只有 7 位（`b7ac4dc`），v1.93.0 因此报
# "built from commit b7ac4dc3, but tag points at b7ac4dc"。改为取 `git rev-parse HEAD` 完整 sha，记录值
# 至少 7 位十六进制且是它的前缀才算一致（`toolchain/_lock_writeback.ps1` 的 `Test-WsGameCommitMatch`，
# 比对只此一处，`toolchain/tests/test_release_commit_match.py` 覆盖 7/8/40 位与不一致/过短/dirty 后缀）。
# v1.92.0 则死在更前面一步：本机 1.92.0 发布包的条目分隔符是正斜杠（`ws-game-1.92.0/MANIFEST.txt`），而
# 本文件用反斜杠字面量精确匹配条目名，报 "has no MANIFEST.txt at expected path"；同一类写法也在"缺附件
# 修复"的 .tgz 抽取处。改为 `Get-WsGameZipEntry`（两侧归一为正斜杠再比，与 `_lock_writeback.ps1` 内
# 既有的取条目函数同一口径）。结果上，v1.92.0/v1.93.0 的 Release 只有本机上传的 zip/lock/samples/两个
# 脚本，四个 .tgz 一直没补上（本工作流是唯一从已验证 zip 抽 .tgz 上传的地方，而它每次都在本步骤被拦下）。
#
# 判断记录（run: 脚本正文必须是纯 ASCII，2026-09-07 新增）：推送标签 v1.0.0 触发的运行
# （run 34094116412）在 "Resolve version from tag" 步骤失败，报
# "The string is missing the terminator: ''" / "Missing closing '}'"。根因：GitHub Actions
# 把 `shell: powershell` 步骤的 `run:` 正文写成不带 BOM 的 UTF-8 临时 .ps1 文件；托管运行器上的
# Windows PowerShell 5.1 按系统 ANSI 代码页（英文镜像是 cp1252）读取该文件，中文提示文本的 UTF-8
# 字节序列里恰好出现 0x93/0x94 等字节，被 cp1252 解释成弯引号“ ”，而 PowerShell 词法分析器把
# 弯引号也当成字符串定界符，于是脚本正文里的字符串边界被打乱、报语法错误。`ci.yml` 的
# `shell: powershell` 步骤没有中招，是因为它的 `run:` 正文本来就只有 ASCII 字符（中文说明全写在
# `run:` 代码块之外的 YAML `#` 注释里，注释不受这个问题影响）。规则：本文件（以及任何
# `shell: powershell` 步骤）的 `run:` 正文只允许 ASCII 字符；提示文案一律用英文，中文说明写在
# `run:` 之外的 `#` 注释里。已用
# `[System.Management.Automation.Language.Parser]::ParseInput` 对每个 run: 正文做过本地语法解析
# 验证（抽出正文存为无 BOM UTF-8 文件，`powershell -File` 试执行/解析），确认无错。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # 判断记录：手动重跑入口，用于对已经推送过的 tag 重新验证本工作流（例如本工作流自身改动后
    # 想在不重新打 tag 的前提下确认修复有效），不产生新 tag，也不改变"本机已验证产物优先"的
    # 附件策略——手动跑一样会先查 Release 是否已有对应 zip，已有照样跳过打包上传。
    inputs:
      tag:
        description: "Tag to verify, formatted as vX.Y.Z (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # 双保险：见 ci.yml 判断记录"控制台 UTF-8 + PowerShell 5.1 原生 stderr 包装两处根因"。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 判断记录：push 触发时 github.event.inputs.tag 为空，取 github.ref_name（即被推送的
          # tag 本身）；workflow_dispatch 触发时 github.ref_name 是运行工作流所在的分支（如
          # main），必须显式取输入的 tag，否则会 checkout 到分支 HEAD 而不是要验证的那个 tag。
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Stage self-contained get_framework.ps1 assets
        shell: powershell
        # 判断记录（消费方反馈 E2 根治，2026-09-10，见
        # docs/消费方反馈/消费方反馈-2026-09-10-编辑器.md E2）：toolchain/get_framework.ps1
        # 与 toolchain/_hash.ps1 是随本次 tag 提交一起 checkout 出来的纯文本源文件，不依赖任何
        # dotnet/npm 构建步骤——与下面的 zip/lock/tgz（确定性构建产物，字节随 checkout 路径变化，
        # 见文件头"本机已验证产物优先"一整套判断记录）性质完全不同，同一个 commit checkout 出来的
        # 这两个文件在任何机器上都是逐字节相同的，没有"托管运行器重建出不同字节"的风险，不需要走
        # 下面那一整套"是否已存在/是否需要从 zip 抽取/是否阻断"的批次一致性判定。这里在
        # 最前面无条件拷贝一份到 dist/，后面按普通附件走"缺失才上传"逻辑即可。
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item -Path "toolchain\get_framework.ps1" -Destination "dist\get_framework.ps1" -Force
          Copy-Item -Path "toolchain\_hash.ps1" -Destination "dist\_hash.ps1" -Force
          Write-Host "Staged dist/get_framework.ps1 and dist/_hash.ps1 from checkout (plain source files, commit-identical everywhere)."

      - name: Setup .NET 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: toolchain/requirements.txt

      - name: Setup Node.js 20.x
        # check.ps1 的包清单类步骤与相关 pytest 用例可能调用 node/npm；显式 setup-node 固定版本，
        # 不依赖托管运行器预装的版本浮动（本工作流自身不再打包，不再有 build.ps1 步骤）。
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Python dependencies
        run: pip install -r toolchain/requirements.txt

      - name: Resolve version from tag
        id: version
        shell: powershell
        # 判断记录：tag 名固定形如 "vX.Y.Z"，去掉前导 "v" 就是附件文件名里的纯版本号；
        # 同时校验一遍格式，格式不对直接失败，不静默用一个错误版本号继续。
        # workflow_dispatch 手动触发时用输入的 tag，push 触发时用 github.ref_name；见文件头
        # "run: 脚本正文必须是纯 ASCII" 判断记录，本步骤提示文案改用英文。
        run: |
          $ErrorActionPreference = "Continue"
          $tagName = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrEmpty($tagName)) {
            $tagName = "${{ github.ref_name }}"
          }
          if (-not ($tagName -like "v*")) {
            Write-Host "Unexpected tag name: $tagName (expected vX.Y.Z)"
            exit 1
          }
          $version = $tagName.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "Version parsed from tag is invalid: '$version' (expected X.Y.Z)"
            exit 1
          }
          Write-Host "tag=$tagName -> version=$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run check.ps1 -SkipUnity -Quick
        shell: powershell
        # 判断记录：见 ci.yml 同名步骤的判断记录（$ErrorActionPreference 降级 + -LogFile 落盘，
        # 不再对外层包 2>&1 管道）。
        run: |
          $ErrorActionPreference = "Continue"
          $artifactsPath = Join-Path $env:RUNNER_TEMP "gf_release_check_artifacts"
          $logPath = Join-Path $env:RUNNER_TEMP "release_check_output.log"
          powershell -NoProfile -ExecutionPolicy Bypass -File check.ps1 -SkipUnity -Quick -ArtifactsPath $artifactsPath -LogFile $logPath
          exit $LASTEXITCODE

      - name: Upload check.ps1 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-logs
          path: |
            ${{ runner.temp }}/release_check_output.log
            ${{ runner.temp }}/gf_release_check_artifacts/**/*.log
            ${{ runner.temp }}/gf_release_check_artifacts/**/*.binlog
          if-no-files-found: ignore

      - name: Check for existing release assets
        id: assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        # 判断记录：见文件头"附件策略"与"zip 缺失一律明确失败"两段。用 gh release view --json assets
        # 查该 tag 对应 Release 的既有附件列表，与完整附件集合（十一件，见下面 $requiredNames）逐一比对，
        # 处置结论（Skip / Repair / Blocked）由 Get-WsGameReleaseAssetsPlan 给出。zip 已存在时先下载校验
        # 其 MANIFEST.txt 的 git_commit，lock 已存在时校验其 git_commit，与当前 checkout 的提交不一致
        # 直接阻断（与是否还缺其它附件无关）；缺失的文件路径放进下面上传步骤的 files 列表，已存在的
        # 附件不会被覆盖。
        # 判断记录（六包，F3 + ADR-0160）：ADR-0018 决策 3 新增第四个私服包 com.gamefoundation.adapter.headless，
        # ADR-0160 再新增两个可选的开发期包 com.gamefoundation.feel-lab.unity / feel-lab.headless
        # （见 toolchain/registry/registry.json、门禁"包清单一致性"步骤的包名清单）；
        # "Repair missing assets from existing zip" 步骤按 tgz 文件名通配处理，新增包后自动覆盖。
        # 两个实验室包只以 .tgz 附件发布，不进主 zip（主 zip 不含任何实验室内容，ADR-0160）。
        # 判断记录（消费方反馈 E2/E4 根治，2026-09-10，见
        # docs/消费方反馈/消费方反馈-2026-09-10-编辑器.md E2/E4）：get_framework.ps1、_hash.ps1（固定文件名，
        # 不带版本号，上一步已无条件拷到 dist/，纯源文件，任何 commit 下都是确定性的）与
        # ws-game-$version-samples.zip（验收数据集独立包）是必需附件。get_framework.ps1/_hash.ps1 不算
        # "批次敏感"附件（见 toolchain/_release_assets_plan.ps1 的 PlainSourceNames），永远可以安全地从当前
        # checkout 重新拷贝，不因它们碰巧已是 Release 附件而改变 zip 缺失时的结论。
        # 判断记录（run: 正文必须是纯 ASCII，见文件头判断记录）：本步骤 run: 正文里原本内联的这些
        # 中文说明已移到这里（YAML # 注释，不受该限制），run: 正文只保留英文提示文案。
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"

          $requiredNames = @(
            "ws-game-$version.zip",
            "ws-game-$version.lock",
            "ws-game-$version-samples.zip",
            "com.gamefoundation.adapter.unity-$version.tgz",
            "com.gamefoundation.framework-data-$version.tgz",
            "com.gamefoundation.toolchain-$version.tgz",
            "com.gamefoundation.adapter.headless-$version.tgz",
            "com.gamefoundation.feel-lab.unity-$version.tgz",
            "com.gamefoundation.feel-lab.headless-$version.tgz",
            "get_framework.ps1",
            "_hash.ps1"
          )
          $requiredPaths = @{
            "ws-game-$version.zip" = "dist/ws-game-$version.zip"
            "ws-game-$version.lock" = "dist/ws-game-$version.lock"
            "ws-game-$version-samples.zip" = "dist/ws-game-$version-samples.zip"
            "com.gamefoundation.adapter.unity-$version.tgz" = "dist/$version/packages/com.gamefoundation.adapter.unity-$version.tgz"
            "com.gamefoundation.framework-data-$version.tgz" = "dist/$version/packages/com.gamefoundation.framework-data-$version.tgz"
            "com.gamefoundation.toolchain-$version.tgz" = "dist/$version/packages/com.gamefoundation.toolchain-$version.tgz"
            "com.gamefoundation.adapter.headless-$version.tgz" = "dist/$version/packages/com.gamefoundation.adapter.headless-$version.tgz"
            "com.gamefoundation.feel-lab.unity-$version.tgz" = "dist/$version/packages/com.gamefoundation.feel-lab.unity-$version.tgz"
            "com.gamefoundation.feel-lab.headless-$version.tgz" = "dist/$version/packages/com.gamefoundation.feel-lab.headless-$version.tgz"
            "get_framework.ps1" = "dist/get_framework.ps1"
            "_hash.ps1" = "dist/_hash.ps1"
          }

          $json = gh release view $tag --json assets 2>$null
          $existingNames = @()
          if ($LASTEXITCODE -eq 0 -and $json) {
            $existingNames = @(($json | ConvertFrom-Json).assets | ForEach-Object { $_.name })
          } else {
            Write-Host "Release $tag not found yet (gh release view exit code $LASTEXITCODE). Treating all required assets as missing (this blocks, it never triggers a rebuild)."
          }

          $missingNames = @($requiredNames | Where-Object { $existingNames -notcontains $_ })
          $zipName = "ws-game-$version.zip"
          $lockName = "ws-game-$version.lock"
          $zipExists = $existingNames -contains $zipName
          $lockExists = $existingNames -contains $lockName
          # Full 40-char sha of the commit this tag points at. The recorded git_commit values (zip
          # MANIFEST.txt, lock) are abbreviated by the release machine and may be 8 chars where a
          # shallow CI clone abbreviates to 7, so they are matched as a prefix of the full sha
          # (Test-WsGameCommitMatch) instead of by string equality.
          . "toolchain\_lock_writeback.ps1"
          $currentCommit = (git rev-parse HEAD).Trim()

          if ($zipExists) {
            $downloadDir = Join-Path $env:RUNNER_TEMP "gf_existing_zip"
            New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
            gh release download $tag -p $zipName -D $downloadDir --clobber
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Failed to download existing asset $zipName for commit verification (exit $LASTEXITCODE)."
              exit 1
            }
            $existingZipPath = Join-Path $downloadDir $zipName
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zipTopLevelName = "ws-game-$version"
            $zr = [System.IO.Compression.ZipFile]::OpenRead($existingZipPath)
            $manifestEntry = Get-WsGameZipEntry -ZipReader $zr -EntryPath "$zipTopLevelName\MANIFEST.txt"
            if (-not $manifestEntry) {
              $zr.Dispose()
              Write-Host "Existing $zipName has no MANIFEST.txt at expected path $zipTopLevelName\MANIFEST.txt; cannot verify git_commit. Blocking."
              exit 1
            }
            $reader = New-Object System.IO.StreamReader($manifestEntry.Open())
            $manifestText = $reader.ReadToEnd()
            $reader.Close()
            $zr.Dispose()
            $mc = [regex]::Match($manifestText, 'git_commit:\s*(\S+)')
            if (-not $mc.Success) {
              Write-Host "Existing $zipName MANIFEST.txt has no git_commit line. Blocking."
              exit 1
            }
            $zipCommit = $mc.Groups[1].Value
            if (-not (Test-WsGameCommitMatch -Recorded $zipCommit -FullSha $currentCommit)) {
              Write-Host "Existing $zipName was built from commit $zipCommit, but tag $tag points at $currentCommit. Refusing to reuse or rebuild-mix; investigate manually."
              exit 1
            }
            Write-Host "Existing $zipName commit verified: $zipCommit matches tag $tag."
            "existing_zip_path=$existingZipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          if ($lockExists) {
            $downloadDirLock = Join-Path $env:RUNNER_TEMP "gf_existing_lock"
            New-Item -ItemType Directory -Force -Path $downloadDirLock | Out-Null
            gh release download $tag -p $lockName -D $downloadDirLock --clobber
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Failed to download existing asset $lockName for commit verification (exit $LASTEXITCODE)."
              exit 1
            }
            $existingLockPath = Join-Path $downloadDirLock $lockName
            $lockObjExisting = Get-Content -Raw -Path $existingLockPath | ConvertFrom-Json
            $lockCommit = $lockObjExisting.git_commit
            if ([string]::IsNullOrEmpty($lockCommit)) {
              Write-Host "Existing $lockName has no git_commit field. Blocking."
              exit 1
            }
            if (-not (Test-WsGameCommitMatch -Recorded $lockCommit -FullSha $currentCommit)) {
              Write-Host "Existing $lockName was built from commit $lockCommit, but tag $tag points at $currentCommit. Refusing to treat it as part of this batch; investigate manually."
              exit 1
            }
            Write-Host "Existing $lockName commit verified: $lockCommit matches tag $tag."
          }

          # Decision is a pure function in toolchain/_release_assets_plan.ps1 (see its notes for why
          # an all-missing release is a hard failure here instead of a hosted rebuild).
          . "toolchain\_release_assets_plan.ps1"
          $plan = Get-WsGameReleaseAssetsPlan -Tag $tag -Version $version -ExistingNames $existingNames -RequiredNames $requiredNames
          foreach ($line in $plan.Message) { Write-Host $line }
          if ($plan.Action -eq "Blocked") {
            Write-Host "Release asset check failed ($($plan.Reason)); see guidance above."
            exit 1
          }
          if ($plan.Action -eq "Skip") {
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          $missingPaths = @($missingNames | ForEach-Object { $requiredPaths[$_] })
          "missing_files<<GF_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          foreach ($p in $missingPaths) {
            $p | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          "GF_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Repair missing assets from existing zip
        # 判断记录：见文件头"缺附件 fallback 根治为'从已验证 zip 抽取'"。只在 zip 存在且 commit 已
        # 校验通过、但 lock 或某个 .tgz 缺失时运行；直接从上一步下载好的 zip 里抽取字节/重算哈希，
        # 不调用 build.ps1、不触发任何新构建，因此不存在"新构建批次配旧 zip"的混批风险。
        # 判断记录（消费方反馈 E4 根治，2026-09-10）：samples zip（data/_sample、assets/_sample
        # 打包）内容全部来自当前 checkout 里的纯文本/资源源文件，不依赖任何编译产物——与六个核心
        # DLL（确定性构建、字节随 checkout 路径变化）性质不同，可以安全地直接用 Compress-Archive
        # 重新生成，不算"新构建批次混旧产物"。若缺失清单里有它，统一在 lock/tgz 循环之前重建一次，
        # 供 lock 分支（若也缺失）引用其 sha256；若 lock 已存在（这次不重建）且带 samples.sha256
        # 字段，重建出的 samples zip 哈希必须与之一致，否则说明历史 lock 记录的是另一份不同内容的
        # samples zip（理论上不该发生，但一旦发生绝不能悄悄发布一份哈希对不上已发布 lock 的附件），
        # 阻断并提示人工核查。lock 需要重建时一并补上 samples 字段：优先用刚重建好的哈希（常见
        # 情形，samples zip 同批一起缺失）；samples zip 这次不缺失（已是既有附件，少见组合）则下载
        # 它计算哈希；两者都取不到（理论上不该发生）则跳过该字段，保持向后兼容语义
        # （get_framework.ps1 遇到缺字段的旧锁文件会跳过对应校验并提示，不视为篡改，见该脚本判断
        # 记录）。get_framework.ps1/_hash.ps1 两个纯源文件不需要从 zip 里抽取/重算——上面 "Stage
        # self-contained get_framework.ps1 assets" 步骤已经无条件拷贝到位，这里直接跳过。
        # 判断记录（run: 正文必须是纯 ASCII，见文件头判断记录）：本步骤 run: 正文里原本内联的中文
        # 说明已移到这里（YAML # 注释，不受该限制），run: 正文只保留英文提示文案。
        if: steps.assets.outputs.skip != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $existingZipPath = "${{ steps.assets.outputs.existing_zip_path }}"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipTopLevelName = "ws-game-$version"
          $zr = [System.IO.Compression.ZipFile]::OpenRead($existingZipPath)

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          # See TOOL-118-LOCK judgment note in toolchain/_lock_writeback.ps1: the "generate a full
          # lock object from an existing verified zip" logic (six core DLLs + Adapters.Stub.dll +
          # Validator.dll hashes + MANIFEST.txt git_commit) lives in exactly one place
          # (New-WsGameLockObjectFromZip) now, shared with anything else that needs to rebuild a
          # lock from a zip; this repair branch cannot silently drop headless_dlls/validator_dlls
          # again by re-implementing the extraction loop here.
          . "toolchain\_hash.ps1"
          . "toolchain\_lock_writeback.ps1"

          $missingRaw = @"
          ${{ steps.assets.outputs.missing_files }}
          "@
          $missing = $missingRaw -split "`r?`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" }

          # See YAML comment above for rationale (samples zip is rebuilt here from plain checkout
          # source files, unlike the DLL/lock/tgz path which must come from the verified zip).
          $samplesZipMissingPath = "dist/ws-game-$version-samples.zip"
          $regeneratedSamplesSha = $null
          if ($missing -contains $samplesZipMissingPath) {
            $samplesStagingRoot = Join-Path $env:RUNNER_TEMP ("gf_release_samples_staging_" + [guid]::NewGuid().ToString("N"))
            $samplesStagingDir = Join-Path $samplesStagingRoot $zipTopLevelName
            New-Item -ItemType Directory -Force -Path $samplesStagingDir | Out-Null
            Copy-Item -Path "data\_sample" -Destination (Join-Path $samplesStagingDir "data\_sample") -Recurse -Force
            Copy-Item -Path "assets\_sample" -Destination (Join-Path $samplesStagingDir "assets\_sample") -Recurse -Force
            Compress-Archive -Path $samplesStagingDir -DestinationPath $samplesZipMissingPath -CompressionLevel Optimal -Force
            Remove-Item -Path $samplesStagingRoot -Recurse -Force -ErrorAction SilentlyContinue
            $regeneratedSamplesSha = (Get-FileHash -Path $samplesZipMissingPath -Algorithm SHA256).Hash.ToLower()
            Write-Host "Regenerated $samplesZipMissingPath from checkout (plain source files, no build-path nondeterminism); sha256=$regeneratedSamplesSha"

            if (-not ($missing -contains "dist/ws-game-$version.lock")) {
              $existingLockPathForSamplesCheck = Join-Path $env:RUNNER_TEMP "gf_existing_lock\ws-game-$version.lock"
              if (Test-Path $existingLockPathForSamplesCheck) {
                $existingLockForSamplesCheck = Get-Content -Raw -Path $existingLockPathForSamplesCheck | ConvertFrom-Json
                if ($null -ne $existingLockForSamplesCheck.samples -and -not [string]::IsNullOrEmpty($existingLockForSamplesCheck.samples.sha256)) {
                  if ($existingLockForSamplesCheck.samples.sha256 -ne $regeneratedSamplesSha) {
                    Write-Host "BLOCKED: existing ws-game-$version.lock records samples.sha256=$($existingLockForSamplesCheck.samples.sha256), but the samples zip regenerated from this commit's checkout hashes to $regeneratedSamplesSha. Refusing to publish a mismatched pair; investigate manually (see file header note on deterministic-build mixed-batch risk)."
                    exit 1
                  }
                  Write-Host "Regenerated samples zip sha256 matches existing lock's samples.sha256 field."
                }
              }
            }
          }

          foreach ($m in $missing) {
            if ($m -eq $samplesZipMissingPath) {
              continue # Already rebuilt above.
            }
            if ($m -eq "dist/get_framework.ps1" -or $m -eq "dist/_hash.ps1") {
              continue # Already staged in the "Stage self-contained get_framework.ps1 assets" step.
            }
            if ($m -eq "dist/ws-game-$version.lock") {
              $samplesShaForLock = $regeneratedSamplesSha
              if ([string]::IsNullOrEmpty($samplesShaForLock)) {
                $existingSamplesAssetPath = Join-Path $env:RUNNER_TEMP "gf_existing_samples\ws-game-$version-samples.zip"
                if (-not (Test-Path $existingSamplesAssetPath)) {
                  New-Item -ItemType Directory -Force -Path (Split-Path $existingSamplesAssetPath -Parent) | Out-Null
                  gh release download $tag -p "ws-game-$version-samples.zip" -D (Split-Path $existingSamplesAssetPath -Parent) --clobber 2>$null
                }
                if (Test-Path $existingSamplesAssetPath) {
                  $samplesShaForLock = (Get-FileHash -Path $existingSamplesAssetPath -Algorithm SHA256).Hash.ToLower()
                }
              }
              if ([string]::IsNullOrEmpty($samplesShaForLock)) {
                Write-Host "Could not determine samples zip sha256 while regenerating $m; omitting 'samples' field (backward-compatible, see get_framework.ps1 judgment note)." -ForegroundColor Yellow
              }
              # Same lock object shape/field order/JSON write-out as build.ps1's normal path, and
              # the same DLL-hash-from-zip extraction as this branch always used for the six core
              # DLLs -- both now live only in toolchain/_lock_writeback.ps1 (dot-sourced above),
              # so headless_dlls/validator_dlls cannot be silently dropped here again.
              $lockObj = New-WsGameLockObjectFromZip -ZipPath $existingZipPath -Version $version -SamplesSha256 $samplesShaForLock
              Write-WsGameLockFile -Path $m -LockObject $lockObj
              Write-Host "Regenerated $m from the DLLs inside the existing zip (same bytes, recomputed hash; headless_dlls/validator_dlls included, TOOL-118-LOCK)."
            } elseif ($m -like "*.tgz") {
              $tgzName = Split-Path $m -Leaf
              if ($tgzName -like "com.gamefoundation.feel-lab.*") {
                Write-Host "BLOCKED: $tgzName is a feel-lab package and is not part of the main zip (ADR-0160), so it cannot be repaired from the zip. Upload it from the release machine: gh release upload $tag dist/$version/packages/$tgzName"
                exit 1
              }
              $entryPath = "$zipTopLevelName\packages\$tgzName"
              $entry = Get-WsGameZipEntry -ZipReader $zr -EntryPath $entryPath
              if (-not $entry) {
                Write-Host "Missing tgz entry in zip: $entryPath"
                exit 1
              }
              $destDir = Split-Path $m -Parent
              New-Item -ItemType Directory -Force -Path $destDir | Out-Null
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $m, $true)
              Write-Host "Extracted $m from the existing zip's embedded packages."
            } else {
              Write-Host "Unexpected missing file path (not lock or tgz): $m"
              exit 1
            }
          }
          $zr.Dispose()

      - name: Upload Release assets
        if: steps.assets.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # 判断记录（只上传 assets 步骤算出的缺失文件，不再固定列出全部六个）：见上面 "Check for
          # existing release assets" 步骤——files 现在来自 steps.assets.outputs.missing_files
          # （每行一个 dist 相对路径），只包含本次核对时缺失的附件；已经存在于 Release 的附件不在
          # 列表里，softprops/action-gh-release 不会碰它们（"本机已验证产物优先"，见文件头判断
          # 记录）。本步骤只在 zip 已存在（Repair 结论）时到达：zip 缺失一律在上一步阻断，不会上传。
          files: ${{ steps.assets.outputs.missing_files }}
          # 判断记录（四个 .tgz 只作为 Release 附件、不在这里发到任何注册表）：私服（Verdaccio）
          # 只服务内网/本机场景，托管运行器既没有、也不应该配置一个可公网访问的私服地址；发布到
          # 注册表是本机 `build.ps1 -Release -Publish -PublishRegistry` 的职责（见该开关说明），
          # 本工作流只把从已验证 zip 内原样抽出的四个 .tgz 一并作为 GitHub Release 附件上传，
          # 方便没有私服访问权限的场景也能拿到这四个包（手动 `npm install <tgz 路径>` 或
          # `npm publish <tgz 路径> --registry <自己的私服>`）。
          # 判断记录：不传 body/generate_release_notes——Release 已由本机 `-Release -Publish` 创建
          # （已带标题与 CHANGELOG.md 摘录的说明文本；本步骤只在 zip 已存在时到达，Release 必已存在），
          # 这里只追加附件，不覆盖已有说明，避免与本机 `-Release` 生成的 dist/release-notes-<ver>.txt
          # 出现两份措辞不一致的发布说明。
          fail_on_unmatched_files: true
